server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: serve index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
